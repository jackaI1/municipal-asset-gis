name: GIS build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PROJ_DATA: /usr/share/proj
      GDAL_DATA: /usr/share/gdal
    steps:
      - uses: actions/checkout@v4
      - name: Install QGIS and Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-qgis python3-venv fonts-dejavu-core
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements.txt
      - name: Build registry exports
        run: PYTHONPATH=src .venv/bin/python -m municipal_gis.pipeline
      - name: Diagnose native map readers
        run: |
          .venv/bin/python - <<'PYCODE'
          from qgis.core import QgsApplication,QgsVectorLayer
          from osgeo import gdal
          from pathlib import Path
          app=QgsApplication([],False);app.initQgis()
          print("GDAL",gdal.VersionInfo(),"file",Path("outputs/assets.gpkg").stat().st_size)
          layers=[]
          for name in ["assets"]*6+["roads"]:
              layer=QgsVectorLayer(str(Path("outputs/assets.gpkg").resolve())+"|layername="+name,name,"ogr")
              layers.append(layer)
              print(name,"valid",layer.isValid(),"count",layer.featureCount(),"crs",layer.crs().authid(),"extent",layer.extent().toString())
          PYCODE
      - name: Build QGIS project and printed map
        run: PYTHONPATH=src .venv/bin/python -m municipal_gis.qgis_project
      - name: Test calculations, exports and project portability
        run: |
          .venv/bin/python -c 'import qgis.core'
          .venv/bin/python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: municipal-gis-outputs
          path: outputs/
          retention-days: 14
